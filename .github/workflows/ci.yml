# Actions are pinned to commit SHAs; .github/dependabot.yml keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer run on the same ref cancels an older PR run, but a run on main
# (which may be deploying) is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Runs before `npm ci` so that node_modules is not scanned.
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Unit tests for the Codex Review Gate script (no dependencies; Node's built-in runner).
      - name: Test review gate script
        run: node --test scripts/*.test.mjs

      - name: Go vet
        run: go vet ./...

      # cmd/wasm only builds with GOOS=js GOARCH=wasm, so plain `go vet ./...` skips it.
      - name: Go vet (wasm)
        run: GOOS=js GOARCH=wasm go vet ./cmd/wasm

      - name: Go test
        run: go test -race ./...

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # build:pages builds the WebAssembly module, runs `tsc --noEmit`, then builds the site.
      - name: Build Pages site
        working-directory: web
        run: npm run build:pages

      # `make serve` embeds this build in the Go binary; build:pages does not produce it.
      - name: Build embedded front end
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-pages
          path: web/dist-pages
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-pages
          path: dist-pages

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-pages --project-name=quorum-kitties --branch=main
